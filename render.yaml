services:
  - type: web
    name: sete-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run deploy-commands && npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1517984369120378980"
      - key: DISCORD_GUILD_ID
        value: "1523391016634417202"
      - key: MONGODB_URI
        sync: false
