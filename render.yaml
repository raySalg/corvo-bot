services:
  - type: web
    name: sete-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: (npm run deploy-commands || true) && npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
